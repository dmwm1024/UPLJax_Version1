<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pool League Schedule</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #1a202c;
      color: #fff;
      padding: 1.5rem 1rem 1.25rem;
      text-align: center;
    }
    header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }
    header p { color: #a0aec0; font-size: 0.875rem; margin-top: 0.3rem; }

    /* ── Week navigation ── */
    .week-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1rem;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .nav-btn {
      background: #1a202c;
      color: #fff;
      border: none;
      border-radius: 8px;
      width: 2.25rem;
      height: 2.25rem;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .nav-btn:hover:not(:disabled) { background: #2d3748; }
    .nav-btn:disabled { background: #cbd5e0; cursor: default; }

    .week-info { text-align: center; min-width: 140px; }
    .week-info strong { display: block; font-size: 1.05rem; }
    .week-info small { color: #718096; font-size: 0.78rem; }

    .week-select {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.4rem 0.6rem;
      font-size: 0.875rem;
      background: #f7fafc;
      cursor: pointer;
    }

    /* ── "Tonight" badge ── */
    .tonight-badge {
      background: #c6f6d5;
      color: #276749;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 20px;
      padding: 0.15rem 0.6rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-left: 0.4rem;
      vertical-align: middle;
    }

    /* ── Match grid ── */
    .matches {
      max-width: 960px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1rem;
    }

    /* ── Match card ── */
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .card-header {
      background: #2d3748;
      color: #e2e8f0;
      padding: 0.5rem 1rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .card-body { padding: 0.75rem 1rem; }

    .game-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0;
      gap: 0.5rem;
    }
    .game-row + .game-row { border-top: 1px solid #f7fafc; }

    .game-left {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      min-width: 0;
    }
    .table-pill {
      background: #edf2f7;
      color: #4a5568;
      border-radius: 6px;
      padding: 0.2rem 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .team-name {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .role-tag {
      font-size: 0.65rem;
      color: #a0aec0;
      flex-shrink: 0;
    }
    .sk-badge {
      background: #fefcbf;
      color: #744210;
      border-radius: 6px;
      padding: 0.15rem 0.45rem;
      font-size: 0.68rem;
      font-weight: 700;
      flex-shrink: 0;
      letter-spacing: 0.03em;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: #a0aec0;
      font-size: 0.78rem;
    }

    @media (max-width: 480px) {
      header h1 { font-size: 1.25rem; }
      .matches { grid-template-columns: 1fr; }
    }
  </style>
</head>

<header>
  <h1 id="venue-name"></h1>
  <p id="venue-sub"></p>
</header>

<div class="week-nav">
  <button class="nav-btn" id="prev-btn" onclick="changeWeek(-1)">&#8592;</button>
  <div class="week-info">
    <strong id="week-label"></strong>
    <small id="week-date"></small>
  </div>
  <button class="nav-btn" id="next-btn" onclick="changeWeek(1)">&#8594;</button>
  <select class="week-select" id="week-select" onchange="goToWeek(+this.value)"></select>
</div>

<div class="matches" id="matches"></div>

<footer>Generated by UPL Table Assignments</footer>

<script>
  const weeks = Object.keys(SCHEDULE.weeks).map(Number).sort((a, b) => a - b);
  let current = weeks[0];

  function weekDate(w) {
    if (!SCHEDULE.startDate) return null;
    const start = new Date(SCHEDULE.startDate + 'T12:00:00');
    return new Date(start.getTime() + (w - 1) * SCHEDULE.intervalDays * 86400000);
  }

  function currentWeek() {
    if (!SCHEDULE.startDate) return weeks[0];
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    // Find the first week that is today or in the future
    for (const w of weeks) {
      const d = weekDate(w);
      d.setHours(0, 0, 0, 0);
      if (d >= today) return w;
    }
    return weeks[weeks.length - 1]; // all weeks past — show last
  }

  function isTonight(w) {
    if (!SCHEDULE.startDate) return false;
    const d = weekDate(w);
    const today = new Date();
    return d.getFullYear() === today.getFullYear() &&
           d.getMonth()    === today.getMonth()    &&
           d.getDate()     === today.getDate();
  }

  function changeWeek(delta) {
    const idx = weeks.indexOf(current) + delta;
    if (idx >= 0 && idx < weeks.length) goToWeek(weeks[idx]);
  }

  function goToWeek(w) {
    current = w;
    render();
  }

  function render() {
    document.getElementById('venue-name').textContent = SCHEDULE.venueName;
    document.getElementById('venue-sub').textContent =
      weeks.length + ' week' + (weeks.length !== 1 ? 's' : '');

    const idx = weeks.indexOf(current);
    document.getElementById('prev-btn').disabled = idx === 0;
    document.getElementById('next-btn').disabled = idx === weeks.length - 1;

    const tonight = isTonight(current);
    const badge = tonight ? '<span class="tonight-badge">Tonight</span>' : '';
    document.getElementById('week-label').innerHTML = 'Week ' + current + badge;

    const d = weekDate(current);
    document.getElementById('week-date').textContent = d
      ? d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })
      : '';

    const sel = document.getElementById('week-select');
    sel.innerHTML = weeks.map(w =>
      `<option value="${w}" ${w === current ? 'selected' : ''}>Week ${w}</option>`
    ).join('');

    const matchups = SCHEDULE.weeks[String(current)] || [];
    document.getElementById('matches').innerHTML = matchups.map(m => {
      const tables = m.games.map(g => g.table).join(' & ');
      const rows = m.games.map(g => {
        const isHome = g.scorekeeper === m.home;
        const isAway = g.scorekeeper === m.away;
        const skTeam = g.scorekeeper;
        // Determine which team is which for this game's scorekeeper line
        const homeLine = `
          <div class="game-row">
            <div class="game-left">
              <span class="table-pill">${g.table}</span>
              <span class="team-name">${m.home}</span>
              <span class="role-tag">H</span>
            </div>
            ${skTeam === m.home ? '<span class="sk-badge">Scorekeeper</span>' : ''}
          </div>`;
        const awayLine = `
          <div class="game-row">
            <div class="game-left">
              <span class="table-pill">${g.table}</span>
              <span class="team-name">${m.away}</span>
              <span class="role-tag">A</span>
            </div>
            ${skTeam === m.away ? '<span class="sk-badge">Scorekeeper</span>' : ''}
          </div>`;
        return skTeam === m.home ? homeLine : awayLine;
      }).join('');

      return `
        <div class="card">
          <div class="card-header">Tables ${tables}</div>
          <div class="card-body">${rows}</div>
        </div>`;
    }).join('');
  }

  current = currentWeek();
  render();
</script>
